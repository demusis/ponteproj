[package]
name = "ponteproj"
version = "0.33.0"
edition = "2021"
description = "Assistente local SIGADOC com captura pelo navegador"
authors = ["Carlo Ralph De Musis", "João Gabriel Bezerra Estrela"]
license = "MIT"
repository = "https://github.com/demusis/ponteproj"

[dependencies]
anyhow = "1"
base64 = "0.22"
pdf-extract = "0.12.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41", features = ["bundled", "backup", "functions"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
# RS256 check of the ChatGPT ID token and random values for the login (already built for rustls).
ring = "0.17"
url = "2"
regex = "1"
directories = "6"
# The window (desktop builds only; the core also builds without it, for the
# phone companion in mobile/).
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "links", "clipboard"], optional = true }
image = { version = "0.25.10", default-features = false, features = ["png"], optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Foundation", "Data_Pdf", "Storage_Streams", "Win32_System_WinRT", "Graphics_Imaging", "Media_Ocr", "Globalization", "Win32_Foundation", "Win32_System_Registry", "Win32_UI_Controls_Dialogs", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi"] }

[features]
default = ["desktop"]
# The window, the PDF reader and every screen. Without it the library holds
# only the core: storage, sealing, team sync, e-mail, models.
desktop = ["dep:eframe", "dep:image"]
# Development only: a sample library and a tour of the screens that saves a
# picture of each one (`ponteproj --shots PASTA`). Never part of a release.
shots = ["desktop"]

[[bin]]
name = "ponteproj"
path = "src/main.rs"
required-features = ["desktop"]

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 2
strip = true

